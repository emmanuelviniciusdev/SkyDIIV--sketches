# Test and build the UI package and Storybook on pull requests and main.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "design/ui/**"
      - "design/storybook/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "design/ui/**"
      - "design/storybook/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: UI package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @emmanuelviniciusdev/SkyDIIV-UI test

      - name: Typecheck
        run: pnpm --filter @emmanuelviniciusdev/SkyDIIV-UI typecheck

      - name: Build
        run: pnpm --filter @emmanuelviniciusdev/SkyDIIV-UI build

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter SkyDIIV-Storybook exec playwright install --with-deps chromium

      - name: Test
        run: pnpm --filter SkyDIIV-Storybook test

      - name: Build
        run: pnpm --filter SkyDIIV-Storybook build-storybook
