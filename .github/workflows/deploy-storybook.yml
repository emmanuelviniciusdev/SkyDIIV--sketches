# Deploy the SkyDIIV Storybook static build to Cloudflare Pages.
#
# Production: push to main (and manual workflow_dispatch).
# Preview: pull requests from this repository.
#
# Required secrets live on the GitHub Environment named production
# (Settings → Environments → production):
#   CLOUDFLARE_PAGES_API_TOKEN  — custom token with Account / Cloudflare Pages / Edit
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard Overview → API
#
# The Pages project name must match CLOUDFLARE_PAGES_PROJECT below (or create
# it on the first deploy). Attach the custom domain in the Cloudflare dashboard.

name: Deploy Storybook

on:
  push:
    branches: [main]
    paths:
      - "design/storybook/**"
      - ".github/workflows/deploy-storybook.yml"
  pull_request:
    paths:
      - "design/storybook/**"
      - ".github/workflows/deploy-storybook.yml"
  workflow_dispatch:

concurrency:
  group: deploy-storybook-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  CLOUDFLARE_PAGES_PROJECT: skydiiv-storybook

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    defaults:
      run:
        working-directory: design/storybook
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_PAGES_API_TOKEN or CLOUDFLARE_ACCOUNT_ID on the production environment."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: design/storybook/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/storybook/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: design/storybook
          packageManager: pnpm
          command: pages deploy storybook-static --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
