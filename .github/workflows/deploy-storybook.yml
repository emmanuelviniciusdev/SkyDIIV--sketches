# Deploy the SkyDIIV Storybook static site to Cloudflare Pages after a merge
# to main (or a manual workflow_dispatch). Storybook build verification lives
# in ci.yml.
#
# Required secrets live on the GitHub Environment named production
# (Settings → Environments → production):
#   CLOUDFLARE_PAGES_API_TOKEN  — custom token with Account / Cloudflare Pages / Edit
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard Overview → API
#
# The Pages project name must match CLOUDFLARE_PAGES_PROJECT below (or create
# it on the first deploy). Attach the custom domain in the Cloudflare dashboard.

name: Deploy Storybook

on:
  push:
    branches: [main]
    paths:
      - "design/ui/**"
      - "design/storybook/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-storybook.yml"
  workflow_dispatch:

concurrency:
  group: deploy-storybook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_PAGES_PROJECT: skydiiv-storybook

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_PAGES_API_TOKEN or CLOUDFLARE_ACCOUNT_ID on the production environment."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter SkyDIIV-Storybook build-storybook

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: design/storybook
          packageManager: pnpm
          command: pages deploy storybook-static --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main
